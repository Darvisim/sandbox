name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        export DYLD_FALLBACK_FRAMEWORK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)/System/Library/Frameworks"
        export DYLD_FALLBACK_LIBRARY_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)/usr/lib"
        xcrun simctl spawn booted /bin/sh -c 'echo "hello"'
