name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        SIM_HOME="$(xcrun simctl getenv booted HOME)"
        echo 'echo "hello"' > "$SIM_HOME/script.sh"
        xcrun simctl spawn booted /bin/bash "$SIM_HOME/script.sh"
