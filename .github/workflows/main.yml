name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          /bin/mkdir /tmp/posix-bootstrap-test &&
          printf "mkdir works\n"

          /bin/ls /tmp

          /bin/rmdir /tmp/posix-bootstrap-test &&
          printf "rmdir works\n"
        '
