name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          for cmd in install busybox toybox perl python3 ruby; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%s: " "$cmd"
              command -V "$cmd"
            fi
          done
        '
