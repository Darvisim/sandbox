name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          for dir in /usr/local/bin /usr/local/sbin /opt/bin /opt/sbin; do
            [ -d "$dir" ] || continue

            for cmd in admin cflow cxref delta get gettext msgfmt ngettext prs rmdel sact sccs timeout unget val xgettext; do
              if [ -x "$dir/$cmd" ] && [ -f "$dir/$cmd" ]; then
                printf "FOUND   %-12s %s\n" "$cmd" "$dir/$cmd"
              fi
            done
          done
        '
