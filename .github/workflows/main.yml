name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        ENV="HOME PATH TMPDIR"
        for var in $ENV; do
          DIR=$(xcrun simctl getenv booted "$var")
          echo "--- $var: $DIR ---"
          if [ -d "$DIR" ]; then
            for item in "$DIR"/*; do
              [ -e "$item" ] && printf "%s\n" "$(basename "$item")"
            done
          else
            if [ "$var" = "PATH" ]; then
              IFS=':'
              for path in $DIR; do
                echo "  Path entry: $path"
                for item in "$path"/*; do
                  [ -e "$item" ] && printf "%s\n" "$(basename "$item")"
                done
              done
              unset IFS
           else
              echo "Directory does not exist or is not accessible."
           fi
          fi
        done
