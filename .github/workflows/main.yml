name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        ENV="HOME PATH TMPDIR"
        for var in $ENV; do
          DIR=$(xcrun simctl getenv booted "$var")
          echo "--- $var: $DIR ---"
          if [ -d "$DIR" ]; then
            for item in "$DIR"/*; do
              if [ -e "$item" ]; then
                printf "%s\n" "$(basename "$item")"
              fi
            done
          else
            if [ "$var" = "PATH" ]; then
              OLD_IFS="$IFS"
              IFS=':'
              for path in $DIR; do
                if [ -n "$path" ]; then
                  echo "  Path entry: $path"
                  if [ -d "$path" ]; then
                    for bin in "$path"/*; do
                      if [ -e "$bin" ]; then
                        printf "%s\n" "$(basename "$bin")"
                      fi
                    done
                  fi
                fi
              done
              IFS="$OLD_IFS"
           else
              echo "Directory does not exist or is not accessible."
           fi
          fi
        done
        exit 0
