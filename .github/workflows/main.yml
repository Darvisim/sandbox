name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        PATH="$(xcrun simctl getenv booted PATH)"
        OLD_IFS="$IFS"
        IFS=":"
        for dir in $PATH; do
          echo "--- $dir ---"
          if [ -d "$dir" ]; then
            find "$dir" -maxdepth 1 -type f -executable -exec basename {} \; 2>/dev/null
          else
            echo "Directory does not exist."
          fi
          echo ""
        done
        IFS="$OLD_IFS"
