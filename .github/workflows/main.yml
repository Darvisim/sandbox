name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          CMD="admin alias ar asa at awk basename batch bc bg cc cal cat cd cflow \
            chgrp chmod chown cksum cmp comm command compress cp cron csplit ctags cut \
            cxref date dd delta df diff dirname du echo ed env ex expand expr false fc fg \
            file find fold fuser gencat get getconf getopts gettext grep hash head iconv id \
            ipcrm ipcs jobs join kill lex link ln locale localedef logger logname lp ls m4 mailx \
            make man mesg mkdir mkfifo more msgfmt mv newgrp ngettext nice nl nm nohup od paste patch \
            pathchk pax pr printf prs ps pwd read readlink realpath renice rm rmdel rmdir sact sccs sed \
            sh sleep sort split strings strip stty tabs tail talk tee test time timeout touch tput tr true \
            tsort tty type ulimit umask unalias uname uncompress unexpand unget uniq unlink uucp \
            uudecode uuencode uustat uux val vi wait wc what who write xargs xgettext yacc zcat"
          
          for cmd in $CMD; do
              found=""
              for dir in /bin /usr/bin /sbin /usr/sbin; do
                  path="$dir/$cmd"
                  if [ -f "$path" ] && [ -x "$path" ]; then
                      found="${found}${path} "
                  fi
              done
          
              if [ -n "$found" ]; then
                  printf "FOUND   %-12s %s\n" "$cmd" "$found"
              else
                  printf "MISSING %-12s\n" "$cmd"
              fi
          done
        '
