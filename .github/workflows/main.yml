name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          /usr/bin/curl https://cmake.org/files/v3.12/cmake-3.12.3.tar.gz
          /usr/bin/tar -xvzf cmake-3.12.3.tar.gz
          /bin/cd cmake-3.12.3
          ./configure --prefix=/usr
          /usr/bin/make -j$(nproc)
          /usr/bin/make install
          cmake --version
        '
