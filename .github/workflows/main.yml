name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /usr/bin/arch -arm64 /bin/sh -c '
          /usr/bin/uname -a
          /usr/bin/git --version
          /usr/bin/clang --version
          /usr/bin/curl --version
        '
