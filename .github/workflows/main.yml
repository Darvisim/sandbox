name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
         printf "Shell started\n"
         printf "PATH=%s\n" "$PATH"

         CMD="ls grep dirname"

         printf "%s\n" "$CMD" |
         while IFS= read -r cmd; do
          printf "Checking: %s\n" "$cmd"
          if command -v "$cmd" >/dev/null 2>&1; then
           printf "%s is available!\n" "$cmd"
           command -V "$cmd"
          else
           printf "%s not found in PATH\n" "$cmd"
          fi
         done
        '
