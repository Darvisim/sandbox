name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          for path in . /tmp /var/tmp; do
            if test -w "$path"; then
              printf "%s is writable\n" "$path"
            else
              printf "%s is not writable\n" "$path"
            fi
          done
        
          if test -w .; then
            if ( : > ./write-test ); then
              printf "File creation succeeded\n"
              rm ./write-test 2>/dev/null || true
            else
              printf "File creation failed\n"
            fi
          fi
        '
