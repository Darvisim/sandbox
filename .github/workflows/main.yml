name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          printf "Current directory: "
          pwd
        
          printf "\nChecking root directory:\n"
          for path in / /bin /tmp /var/tmp; do
            if test -d "$path"; then
              printf "%s exists\n" "$path"
            else
              printf "%s does not exist\n" "$path"
            fi
          done
        
          printf "\nChecking whether /bin is writable:\n"
          if test -w /bin; then
            printf "/bin is writable\n"
          else
            printf "/bin is not writable\n"
          fi
        '
