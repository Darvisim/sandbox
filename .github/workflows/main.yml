name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          for dir in /bin /usr/bin /usr/sbin /sbin; do
            printf "\n--- %s ---\n" "$dir"
        
            for cmd in "$dir"/*; do
              if test -x "$cmd" && test ! -d "$cmd"; then
                printf "%s\n" "$cmd"
              fi
            done
          done
        '
