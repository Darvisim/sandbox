name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
         printf "PATH=%s\n" "$PATH"
         printf "\nCommand lookup:\n"
         command -v ls
         command -v grep
         command -v dirname
         
         printf "\nAbsolute paths:\n"
         test -x /bin/ls && echo "/bin/ls exists"
         test -x /usr/bin/grep && echo "/usr/bin/grep exists"
         test -x /usr/bin/dirname && echo "/usr/bin/dirname exists"
        ' 2>/dev/null || true
