name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        xcrun simctl spawn booted /bin/sh -c '
          for cmd in /bin/mkdir /bin/ls /bin/cat \
                     /usr/bin/awk /usr/bin/grep /usr/bin/sed \
                     /usr/bin/find /usr/bin/touch; do
            if test -x "$cmd"; then
              printf "%s exists and is executable\n" "$cmd"
            else
              printf "%s is not executable\n" "$cmd"
            fi
          done
        '
