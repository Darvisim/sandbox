name: Sandbox

on:
  workflow_dispatch:

jobs:
  test-ios-simulator:
    name: test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: futureware-tech/simulator-action@v6
      with:
        os: 'iOS'
        os_version: ">=18.0"
    - run: |
        ENV="HOME PATH TMPDIR"
        for dir in $ENV; do
          DIR=$(xcrun simctl getenv booted $ENV)
          echo "--- $DIR ---"
          for dir in $DIR; do
            printf "%s\n" "$dir"
          done
        done
